name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (governance + second brain)
        run: python -m unittest discover -s tests -v
      - name: Governance demo
        run: python -m agent_os.demo
      - name: Second-brain demo matches the golden file byte for byte
        run: python -m agent_os.demo_brain | diff -u tests/golden/demo_brain.txt -
